[project]
name = "ucua-backend"
version = "2.0.0"
description = "FastAPI backend for the e-UCUA reporting system"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's File()/Depends() defaults are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
